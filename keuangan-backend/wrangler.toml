name = "keuangan-keluarga-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment variables — isi di Cloudflare Dashboard
# jangan tulis nilai aslinya di sini!
[vars]
APP_NAME = "Keuangan Keluarga API"

# Secrets (set via: wrangler secret put NAMA_VARIABLE):
# SUPABASE_URL
# SUPABASE_KEY
# CLOUDINARY_CLOUD
# CLOUDINARY_KEY
# CLOUDINARY_SECRET
# JWT_SECRET
# PIN_HASH
